name: Deploy PDF Protect

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pdf-protect-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASS }}
          port: 22
          command_timeout: 20m
          script: |
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y git nginx poppler-utils nodejs npm certbot python3-certbot-nginx

            if [ -d /opt/pdf-protect/.git ]; then
              cd /opt/pdf-protect
              git fetch origin main
              git reset --hard origin/main
            else
              git clone https://github.com/hsdarestani/pdf.git /opt/pdf-protect
              cd /opt/pdf-protect
            fi

            node --check server.js
            npm install --omit=dev

            mkdir -p /var/lib/pdf-protect
            chown -R www-data:www-data /var/lib/pdf-protect /opt/pdf-protect

            cat >/etc/systemd/system/pdf-protect.service <<'EOF'
            [Unit]
            Description=PDF Protect Portal
            After=network.target

            [Service]
            Type=simple
            User=www-data
            Group=www-data
            WorkingDirectory=/opt/pdf-protect
            Environment=NODE_ENV=production
            Environment=PORT=3000
            Environment=BASE_URL=https://pdf.smarbiz.sbs
            Environment=DATA_DIR=/var/lib/pdf-protect
            Environment=TZ=Europe/Berlin
            ExecStart=/usr/bin/node /opt/pdf-protect/server.js
            Restart=always
            RestartSec=3

            [Install]
            WantedBy=multi-user.target
            EOF

            systemctl daemon-reload
            systemctl enable pdf-protect
            systemctl restart pdf-protect

            cat >/etc/nginx/sites-available/pdf-protect <<'EOF'
            server {
                listen 80;
                listen [::]:80;
                server_name pdf.smarbiz.sbs;
                client_max_body_size 100M;
                location / {
                    proxy_pass http://127.0.0.1:3000;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_read_timeout 300s;
                }
            }
            EOF

            ln -sfn /etc/nginx/sites-available/pdf-protect /etc/nginx/sites-enabled/pdf-protect
            rm -f /etc/nginx/sites-enabled/default
            nginx -t
            systemctl reload nginx

            certbot --nginx -d pdf.smarbiz.sbs --non-interactive --agree-tos --register-unsafely-without-email --redirect --keep-until-expiring || true
            systemctl is-active --quiet pdf-protect
            curl -fsS http://127.0.0.1:3000/health
